[pytest]
minversion = 6.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=tools/ai_generator
    --cov-report=html
    --cov-report=term-missing
    --cov-branch
markers =
    integration: Integration tests (deselect with '-m "not integration"')
    unit: Unit tests
    slow: Slow tests (deselect with '-m "not slow"')
    security: Security module tests
    mlops: MLOps module tests
    codegen: Code generation module tests
    distributed: Distributed systems module tests
    mobile: Mobile development module tests
    ai_pair: AI pair programming module tests
    testing: Testing module tests
    devops: DevOps module tests
