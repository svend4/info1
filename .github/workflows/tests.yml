name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd 08-Программная-реализация
        pip install -e ".[dev,test]"

    - name: Lint with flake8
      run: |
        cd 08-Программная-реализация
        # Stop the build if there are Python syntax errors or undefined names
        flake8 card_system/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 card_system/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

    - name: Type check with mypy
      run: |
        cd 08-Программная-реализация
        mypy card_system/ --ignore-missing-imports

    - name: Run unit tests
      run: |
        cd 08-Программная-реализация
        python -m unittest card_system/test_card_system.py -v

    - name: Run integration tests
      run: |
        cd 08-Программная-реализация
        python -m unittest card_system/test_integration.py -v

    - name: Test coverage
      run: |
        cd 08-Программная-реализация
        pip install pytest pytest-cov
        pytest card_system/ --cov=card_system --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./08-Программная-реализация/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
