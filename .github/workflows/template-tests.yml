name: Template Generator Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'tools/project_template_generator.py'
      - 'tools/templates/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'tools/project_template_generator.py'
      - 'tools/templates/**'
  schedule:
    # Run every Monday at 9:00 UTC
    - cron: '0 9 * * 1'

jobs:
  test-all-templates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project-type:
          - software
          - research
          - business
          - education
          - legal
          - healthcare
          - arts
          - finance
          - government
          - nonprofit
          - manufacturing
          - agriculture
          - sports
          - hospitality
          - retail
          - hobby
      fail-fast: false

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip

    - name: Test ${{ matrix.project-type }} template generation
      run: |
        cd tools
        python project_template_generator.py \
          --name test-${{ matrix.project-type }} \
          --type ${{ matrix.project-type }} \
          --output /tmp/test-templates

    - name: Verify project structure
      run: |
        PROJECT_DIR="/tmp/test-templates/test-${{ matrix.project-type }}"

        echo "Testing project: test-${{ matrix.project-type }}"
        echo "Project directory: $PROJECT_DIR"

        # Check if project directory exists
        if [ ! -d "$PROJECT_DIR" ]; then
          echo "ERROR: Project directory not created"
          exit 1
        fi

        # Check for required files
        REQUIRED_FILES=(
          "README.md"
          "МЕТОДОЛОГИЯ.md"
          "METRICS.md"
          ".methodology.json"
        )

        for file in "${REQUIRED_FILES[@]}"; do
          if [ ! -f "$PROJECT_DIR/$file" ]; then
            echo "ERROR: Required file $file not found"
            exit 1
          fi
          echo "✓ $file exists"
        done

        # Check for required directories
        REQUIRED_DIRS=(
          "01-Концепция"
          "02-Архитектура"
          "03-Реализация"
          "docs"
          "tools"
        )

        for dir in "${REQUIRED_DIRS[@]}"; do
          if [ ! -d "$PROJECT_DIR/$dir" ]; then
            echo "ERROR: Required directory $dir not found"
            exit 1
          fi
          echo "✓ $dir/ exists"
        done

        echo "✅ All required files and directories exist"

    - name: Validate .methodology.json
      run: |
        PROJECT_DIR="/tmp/test-templates/test-${{ matrix.project-type }}"

        # Check if JSON is valid
        python -c "
        import json
        import sys

        with open('$PROJECT_DIR/.methodology.json', 'r') as f:
            config = json.load(f)

        # Validate required fields
        required_fields = ['project_name', 'project_type', 'created', 'methodology_version', 'cycle']
        for field in required_fields:
            if field not in config:
                print(f'ERROR: Missing required field: {field}')
                sys.exit(1)
            print(f'✓ {field}: {config[field]}')

        # Validate project type
        if config['project_type'] != '${{ matrix.project-type }}':
            print(f'ERROR: project_type mismatch: {config[\"project_type\"]} != ${{ matrix.project-type }}')
            sys.exit(1)

        print('✅ .methodology.json is valid')
        "

    - name: Test health_metrics.py
      run: |
        PROJECT_DIR="/tmp/test-templates/test-${{ matrix.project-type }}"
        cd "$PROJECT_DIR"

        # Run health metrics
        python tools/health_metrics.py > metrics_output.txt

        # Check if output contains expected sections
        if ! grep -q "PROJECT HEALTH METRICS" metrics_output.txt; then
          echo "ERROR: health_metrics.py output doesn't contain expected header"
          cat metrics_output.txt
          exit 1
        fi

        if ! grep -q "CD (Connectivity Density)" metrics_output.txt; then
          echo "ERROR: health_metrics.py output doesn't contain CD metric"
          cat metrics_output.txt
          exit 1
        fi

        echo "✅ health_metrics.py works correctly"
        cat metrics_output.txt

    - name: Test template generation with --templates flag
      run: |
        cd tools
        python project_template_generator.py \
          --name test-${{ matrix.project-type }}-templates \
          --type ${{ matrix.project-type }} \
          --output /tmp/test-templates \
          --templates

        PROJECT_DIR="/tmp/test-templates/test-${{ matrix.project-type }}-templates"

        # Check if templates directory exists (for types that have templates)
        if [ -d "$PROJECT_DIR/docs/templates" ]; then
          echo "✓ docs/templates/ directory created"
          ls -la "$PROJECT_DIR/docs/templates/"
        else
          echo "ℹ️  No extended templates for type: ${{ matrix.project-type }}"
        fi

  test-generator-options:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Test --help output
      run: |
        cd tools
        python project_template_generator.py --help

    - name: Test git integration
      run: |
        cd tools
        git config --global user.email "ci@example.com"
        git config --global user.name "CI Test"

        python project_template_generator.py \
          --name test-git-integration \
          --type software \
          --output /tmp/test-git \
          --git

        # Check if git repo was initialized
        if [ ! -d "/tmp/test-git/test-git-integration/.git" ]; then
          echo "ERROR: Git repository not initialized"
          exit 1
        fi

        echo "✅ Git integration works"

  summary:
    runs-on: ubuntu-latest
    needs: [test-all-templates, test-generator-options]
    if: always()

    steps:
    - name: Check test results
      run: |
        if [ "${{ needs.test-all-templates.result }}" == "success" ] && \
           [ "${{ needs.test-generator-options.result }}" == "success" ]; then
          echo "✅ All template tests passed!"
          echo "✅ Tested all 16 project types successfully"
        else
          echo "❌ Some tests failed"
          exit 1
        fi
