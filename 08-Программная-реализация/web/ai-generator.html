<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Project Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .input-section {
            grid-column: span 2;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .results {
            grid-column: span 2;
        }

        .phase-section {
            margin-bottom: 20px;
            padding: 15px;
            border-left: 4px solid #667eea;
            background: #f8f9ff;
            border-radius: 0 8px 8px 0;
        }

        .phase-section h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .phase-section p {
            color: #555;
            line-height: 1.6;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
            margin-right: 5px;
            margin-bottom: 5px;
        }

        .badge-primary {
            background: #667eea;
            color: white;
        }

        .badge-secondary {
            background: #e0e7ff;
            color: #667eea;
        }

        .badge-success {
            background: #10b981;
            color: white;
        }

        .structure-tree {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
        }

        .structure-tree div {
            padding: 2px 0;
            color: #333;
        }

        .dir {
            color: #667eea;
            font-weight: 600;
        }

        .file {
            color: #555;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .preview-section {
            margin-top: 20px;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: #f0f0f0;
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            font-weight: 500;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: #667eea;
            color: white;
        }

        .preview-content {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 0 8px 8px 8px;
            max-height: 500px;
            overflow-y: auto;
        }

        .preview-content pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea20 0%, #764ba220 100%);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .error {
            background: #fee;
            border-left: 4px solid #f44;
            padding: 15px;
            border-radius: 0 8px 8px 0;
            color: #c00;
        }

        .examples {
            margin-top: 15px;
        }

        .example-btn {
            display: inline-block;
            padding: 8px 16px;
            background: #f0f0f0;
            border: none;
            border-radius: 6px;
            margin: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .example-btn:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI Project Generator</h1>
            <p>Создайте проект просто описав его на естественном языке</p>
        </div>

        <div class="main-content">
            <div class="card input-section">
                <h2>📝 Опишите ваш проект</h2>
                <div class="input-group">
                    <label for="description">Описание проекта:</label>
                    <textarea
                        id="description"
                        placeholder="Например: Финтех MVP на React, бюджет 3 млн ₽, команда 8 человек, срок 4 месяца, критический приоритет"
                    ></textarea>
                </div>

                <div class="input-group">
                    <label for="projectName">Имя проекта (опционально):</label>
                    <input
                        type="text"
                        id="projectName"
                        placeholder="my-awesome-project"
                    >
                </div>

                <div class="examples">
                    <strong>Примеры:</strong><br>
                    <button class="example-btn" onclick="setExample(0)">Fintech стартап</button>
                    <button class="example-btn" onclick="setExample(1)">Healthcare клиника</button>
                    <button class="example-btn" onclick="setExample(2)">E-commerce платформа</button>
                    <button class="example-btn" onclick="setExample(3)">Научное исследование</button>
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" onclick="analyzeProject()" id="btnAnalyze">
                        🔍 Анализировать
                    </button>
                    <button class="btn btn-secondary" onclick="clearForm()">
                        🗑️ Очистить
                    </button>
                </div>
            </div>

            <div class="card results" id="resultsCard" style="display: none;">
                <h2>📊 Результаты анализа</h2>
                <div id="resultsContent"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5001/api/ai';

        const examples = [
            "Финтех MVP на React+FastAPI, бюджет 3 млн ₽, команда 8 человек, срок 4 месяца, критический приоритет",
            "Healthcare телемедицина платформа на React+Node.js, бюджет 8 млн ₽, команда 12, MVP фаза",
            "E-commerce платформа на Django+PostgreSQL, коммерческий проект, production запуск, команда 10",
            "Научное исследование влияния микропластика, грант РНФ 10 млн ₽, команда 25, высокий риск, 24 месяца"
        ];

        function setExample(index) {
            document.getElementById('description').value = examples[index];
        }

        function clearForm() {
            document.getElementById('description').value = '';
            document.getElementById('projectName').value = '';
            document.getElementById('resultsCard').style.display = 'none';
        }

        async function analyzeProject() {
            const description = document.getElementById('description').value.trim();

            if (!description) {
                alert('Пожалуйста, введите описание проекта');
                return;
            }

            const btnAnalyze = document.getElementById('btnAnalyze');
            btnAnalyze.disabled = true;
            btnAnalyze.textContent = '⏳ Анализирую...';

            const resultsCard = document.getElementById('resultsCard');
            const resultsContent = document.getElementById('resultsContent');

            resultsCard.style.display = 'block';
            resultsContent.innerHTML = '<div class="loading"><div class="spinner"></div><p>Анализирую проект через AI pipeline...</p></div>';

            try {
                const response = await fetch(`${API_URL}/analyze`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ description })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${await response.text()}`);
                }

                const data = await response.json();
                displayResults(data);

            } catch (error) {
                resultsContent.innerHTML = `<div class="error">❌ Ошибка: ${error.message}</div>`;
            } finally {
                btnAnalyze.disabled = false;
                btnAnalyze.textContent = '🔍 Анализировать';
            }
        }

        function displayResults(data) {
            const { classification, parameters, structure, adaptations, recommendations } = data;

            let html = '';

            // Phase 1-2: Classification
            html += '<div class="phase-section">';
            html += '<h3>🔍 Phase 1-2: ML Classification</h3>';
            html += `<p><strong>Primary type:</strong> <span class="badge badge-primary">${classification.primary_type}</span> `;
            html += `<span class="badge badge-secondary">${(classification.primary_confidence * 100).toFixed(1)}%</span></p>`;

            if (classification.secondary_types.length > 0) {
                html += '<p><strong>Secondary types:</strong> ';
                classification.secondary_types.forEach(type => {
                    const conf = classification.secondary_confidences[type];
                    html += `<span class="badge badge-secondary">${type} (${(conf * 100).toFixed(1)}%)</span> `;
                });
                html += '</p>';
            }

            if (classification.is_hybrid) {
                html += '<p><span class="badge badge-success">✓ Hybrid Project</span></p>';
            }
            html += '</div>';

            // Phase 3: Parameters
            html += '<div class="phase-section">';
            html += '<h3>⚙️ Phase 3: Extracted Parameters</h3>';

            const params = [];
            if (parameters.budget) params.push(`Budget: ${parameters.budget.formatted}`);
            if (parameters.timeline) params.push(`Timeline: ${parameters.timeline.formatted}`);
            if (parameters.team_size) params.push(`Team: ${parameters.team_size} members`);
            if (parameters.phase) params.push(`Phase: ${parameters.phase.toUpperCase()}`);
            if (parameters.technologies && parameters.technologies.length > 0) {
                params.push(`Technologies: ${parameters.technologies.join(', ')}`);
            }
            if (parameters.priority) params.push(`Priority: ${parameters.priority.toUpperCase()}`);
            if (parameters.industry) params.push(`Industry: ${parameters.industry}`);

            html += '<p>' + params.join(' • ') + '</p>';
            html += '</div>';

            // Phase 3: Structure
            html += '<div class="phase-section">';
            html += '<h3>📦 Phase 3: Template Composition</h3>';
            html += `<p><strong>Strategy:</strong> ${structure.strategy}</p>`;
            html += `<p><strong>Merged types:</strong> ${structure.merged_types.join(' + ')}</p>`;

            // Stats
            html += '<div class="stats">';
            html += `<div class="stat-card"><div class="stat-value">${structure.adapted_directories.length}</div><div class="stat-label">Directories</div></div>`;
            html += `<div class="stat-card"><div class="stat-value">${structure.adapted_files.length}</div><div class="stat-label">Files</div></div>`;
            html += `<div class="stat-card"><div class="stat-value">${adaptations.length}</div><div class="stat-label">Adaptations</div></div>`;
            html += `<div class="stat-card"><div class="stat-value">+${structure.growth_percent}%</div><div class="stat-label">Growth</div></div>`;
            html += '</div>';
            html += '</div>';

            // Adaptations
            if (adaptations.length > 0) {
                html += '<div class="phase-section">';
                html += '<h3>🔧 Phase 3: Applied Adaptations</h3>';
                html += '<ul style="margin-left: 20px;">';
                adaptations.forEach(adapt => {
                    html += `<li>${adapt}</li>`;
                });
                html += '</ul>';
                html += '</div>';
            }

            // Recommendations
            if (recommendations && recommendations.length > 0) {
                html += '<div class="phase-section">';
                html += '<h3>💡 Recommendations</h3>';
                html += '<ul style="margin-left: 20px;">';
                recommendations.forEach(rec => {
                    html += `<li>${rec}</li>`;
                });
                html += '</ul>';
                html += '</div>';
            }

            // Structure preview
            html += '<div class="phase-section">';
            html += '<h3>🌳 Project Structure Preview</h3>';
            html += '<div class="structure-tree">';
            html += `<div class="dir">${document.getElementById('projectName').value || 'project'}/</div>`;
            structure.adapted_directories.slice(0, 15).forEach(dir => {
                html += `<div>├── <span class="dir">${dir}</span></div>`;
            });
            if (structure.adapted_directories.length > 15) {
                html += `<div>└── ... (${structure.adapted_directories.length - 15} more)</div>`;
            }
            html += '</div>';
            html += '</div>';

            document.getElementById('resultsContent').innerHTML = html;
        }
    </script>
</body>
</html>
